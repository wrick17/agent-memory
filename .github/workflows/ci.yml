name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails when wrangler.jsonc changed without regenerating worker-configuration.d.ts.
      - run: npx wrangler types --strict-vars=false --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The local capture client; the real-sandbox probe test skips where Codex is not installed.
      - run: npm run test:local
