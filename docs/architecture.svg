<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="t d">
	<title id="t">Agent Memory architecture</title>
	<desc id="d">On your machine, Claude Code and Codex call the Worker over MCP. The agent-memory client hooks keep full transcripts locally, upload redacted digests and repo-fact reports, and receive the session-start brief. A daily batch leases review items and returns lessons, decisions and preferences. On your Cloudflare account, the Worker stores data in one SQLite Durable Object per profile and an account store, uses optional Workers AI and Vectorize, and writes nightly encrypted exports to R2. Your Clerk app verifies sign-in.</desc>
	<style>
		svg { --bg: #f8fafc; --panel: #eef2f7; --line: #cbd5e1; --box: #ffffff; --edge: #94a3b8; --text: #0f172a; --muted: #475569; --arrow: #64748b; --local: #2563eb; --cloud: #ea580c; }
		@media (prefers-color-scheme: dark) {
			svg { --bg: #0d1117; --panel: #161b22; --line: #30363d; --box: #1c2330; --edge: #3d4654; --text: #e6edf3; --muted: #9da7b3; --arrow: #8b949e; --local: #58a6ff; --cloud: #f0883e; }
		}
		text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
		.bg { fill: var(--bg); }
		.panel { fill: var(--panel); stroke: var(--line); }
		.box { fill: var(--box); stroke: var(--edge); stroke-width: 1.2; }
		.opt { stroke-dasharray: 5 4; }
		.title { font-size: 15px; font-weight: 600; }
		.name { font-size: 14px; font-weight: 600; }
		.sub { font-size: 12px; fill: var(--muted); }
		.label { font-size: 12px; fill: var(--muted); }
		.local { fill: var(--local); }
		.cloud { fill: var(--cloud); }
		.flow { stroke: var(--arrow); stroke-width: 1.5; fill: none; }
		.head { fill: var(--arrow); }
	</style>
	<defs>
		<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path class="head" d="M0 0L10 5L0 10z"/>
		</marker>
	</defs>

	<rect class="bg" width="1000" height="510" rx="12"/>

	<!-- Your machine -->
	<rect class="panel" x="20" y="20" width="380" height="390" rx="10"/>
	<rect class="local" x="20" y="20" width="6" height="390" rx="3"/>
	<text class="title" x="42" y="48">Your machine</text>

	<rect class="box" x="45" y="70" width="330" height="64" rx="8"/>
	<text class="name" x="210" y="98" text-anchor="middle">Claude Code / Codex</text>
	<text class="sub" x="210" y="118" text-anchor="middle">your agents, any session</text>

	<rect class="box" x="45" y="193" width="110" height="64" rx="8"/>
	<text class="name" x="100" y="221" text-anchor="middle">Transcripts</text>
	<text class="sub" x="100" y="240" text-anchor="middle">stay local</text>

	<rect class="box" x="185" y="193" width="190" height="64" rx="8"/>
	<text class="name" x="280" y="221" text-anchor="middle">agent-memory client</text>
	<text class="sub" x="280" y="240" text-anchor="middle">capture, brief, loop guard</text>

	<rect class="box" x="185" y="316" width="190" height="64" rx="8"/>
	<text class="name" x="280" y="344" text-anchor="middle">Daily batch</text>
	<text class="sub" x="280" y="363" text-anchor="middle">judges items with codex exec</text>

	<line class="flow" x1="280" y1="134" x2="280" y2="193" marker-start="url(#a)" marker-end="url(#a)"/>
	<text class="label" x="270" y="158" text-anchor="end">session events ↓</text>
	<text class="label" x="270" y="176" text-anchor="end">brief, loop-guard note ↑</text>
	<line class="flow" x1="185" y1="225" x2="155" y2="225" marker-end="url(#a)"/>

	<!-- Your Cloudflare account -->
	<rect class="panel" x="600" y="20" width="380" height="390" rx="10"/>
	<rect class="cloud" x="600" y="20" width="6" height="390" rx="3"/>
	<text class="title" x="622" y="48">Your Cloudflare account</text>

	<rect class="box" x="625" y="70" width="130" height="310" rx="8"/>
	<text class="name" x="690" y="206" text-anchor="middle">Worker</text>
	<text class="sub" x="690" y="228" text-anchor="middle">/mcp</text>
	<text class="sub" x="690" y="245" text-anchor="middle">/v1 API</text>
	<text class="sub" x="690" y="262" text-anchor="middle">/app dashboard</text>
	<text class="sub" x="690" y="279" text-anchor="middle">/settings</text>

	<rect class="box" x="780" y="70" width="175" height="64" rx="8"/>
	<text class="name" x="867" y="98" text-anchor="middle">Profile stores</text>
	<text class="sub" x="867" y="117" text-anchor="middle">SQLite Durable Object each</text>

	<rect class="box" x="780" y="152" width="175" height="64" rx="8"/>
	<text class="name" x="867" y="180" text-anchor="middle">Account store</text>
	<text class="sub" x="867" y="199" text-anchor="middle">devices, routing</text>

	<rect class="box opt" x="780" y="234" width="175" height="64" rx="8"/>
	<text class="name" x="867" y="262" text-anchor="middle">Workers AI + Vectorize</text>
	<text class="sub" x="867" y="281" text-anchor="middle">optional semantic recall</text>

	<rect class="box" x="780" y="316" width="175" height="64" rx="8"/>
	<text class="name" x="867" y="344" text-anchor="middle">R2 backups</text>
	<text class="sub" x="867" y="363" text-anchor="middle">nightly encrypted export</text>

	<line class="flow" x1="755" y1="102" x2="780" y2="102" marker-end="url(#a)"/>
	<line class="flow" x1="755" y1="184" x2="780" y2="184" marker-end="url(#a)"/>
	<line class="flow opt" x1="755" y1="266" x2="780" y2="266" marker-end="url(#a)"/>
	<line class="flow" x1="755" y1="348" x2="780" y2="348" marker-end="url(#a)"/>

	<!-- Between machine and Cloudflare -->
	<line class="flow" x1="375" y1="102" x2="625" y2="102" marker-end="url(#a)"/>
	<text class="label" x="500" y="94" text-anchor="middle">MCP: save, recall, journal</text>

	<line class="flow" x1="375" y1="212" x2="625" y2="212" marker-end="url(#a)"/>
	<text class="label" x="500" y="204" text-anchor="middle">digests, repo-fact reports</text>
	<line class="flow" x1="625" y1="240" x2="375" y2="240" marker-end="url(#a)"/>
	<text class="label" x="500" y="258" text-anchor="middle">brief, active repo facts</text>

	<line class="flow" x1="375" y1="335" x2="625" y2="335" marker-end="url(#a)"/>
	<text class="label" x="500" y="327" text-anchor="middle">lease review items</text>
	<line class="flow" x1="625" y1="361" x2="375" y2="361" marker-end="url(#a)"/>
	<text class="label" x="500" y="379" text-anchor="middle">lessons, decisions, preferences</text>

	<!-- Clerk -->
	<rect class="box" x="625" y="438" width="330" height="52" rx="8"/>
	<text class="name" x="790" y="469" text-anchor="middle">Your Clerk app</text>
	<line class="flow" x1="690" y1="380" x2="690" y2="438" marker-end="url(#a)"/>
	<text class="label" x="700" y="428">verifies sign-in</text>
</svg>
